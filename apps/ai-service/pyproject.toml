[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "smart-catering-ai-service"
version = "0.0.0"
description = "Smart Catering Python AI Service (FastAPI REST & OpenAPI 3.1 foundation)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "python-dotenv==1.2.4",
  "scalar-fastapi==1.9.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
rag = [
  "chromadb==1.5.9",
  "langchain==1.4.8",
]
ml = [
  "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
