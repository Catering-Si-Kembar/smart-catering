name: smart-catering-vps

services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:05aa77262db9277fde6374bb2f901c9604b8a9373029e1a7993440c6aae48736
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcatering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smart_catering}
    volumes:
      - smart_catering_vps_postgres_data:/var/lib/postgresql/data
    networks:
      - smart_catering_vps_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-smartcatering} -d $${POSTGRES_DB:-smart_catering}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chroma:
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: unless-stopped
    environment:
      IS_PERSISTENT: 'TRUE'
      ANONYMIZED_TELEMETRY: 'FALSE'
    volumes:
      - smart_catering_vps_chroma_data:/data
    networks:
      - smart_catering_vps_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bash -c "exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n\" >&3 && grep -Eq \"^HTTP/1\\.[01] 200 \" <&3"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  waha:
    image: devlikeapro/waha:latest-2026.10.1@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    profiles:
      - waha
    restart: unless-stopped
    environment:
      WHATSAPP_API_PORT: '3000'
      WHATSAPP_DEFAULT_ENGINE: 'NOWEB'
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY must be set in .env}
      WHATSAPP_API_KEY_EXCLUDE_PATH: 'ping,health'
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_SWAGGER_ENABLED: 'false'
      WAHA_PRINT_QR: 'false'
      WHATSAPP_RESTART_ALL_SESSIONS: 'false'
      WAHA_WORKER_RESTART_SESSIONS: 'false'
      WAHA_APPS_ENABLED: 'false'
    volumes:
      - smart_catering_vps_waha_sessions:/app/.sessions
      - smart_catering_vps_waha_files:/tmp/whatsapp-files
    networks:
      - smart_catering_vps_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/ping\").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    environment:
      NODE_ENV: 'production'
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: ${VPS_DATABASE_URL:?VPS_DATABASE_URL must use internal postgres host and URL-encoded credentials}
      AI_SERVICE_URL: 'http://ai-service:8001'
      WAHA_BASE_URL: 'http://waha:3000'
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY must be set in .env}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DOCS_USERNAME: ${DOCS_USERNAME:-}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart_catering_vps_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/health\").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-service:
    build:
      context: ../..
      dockerfile: infra/docker/ai-service.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: 'production'
      CHROMA_URL: 'http://chroma:8000'
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DOCS_USERNAME: ${DOCS_USERNAME:-}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-}
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - smart_catering_vps_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import sys, urllib.request; r = urllib.request.urlopen(\"http://127.0.0.1:8001/health\", timeout=4); sys.exit(0 if r.status == 200 else 1)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: 'production'
      WORKER_HOST: '0.0.0.0'
      WORKER_PORT: '3002'
    networks:
      - smart_catering_vps_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3002/health\").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  smart_catering_vps_net:
    driver: bridge

volumes:
  smart_catering_vps_postgres_data:
  smart_catering_vps_chroma_data:
  smart_catering_vps_waha_sessions:
  smart_catering_vps_waha_files:
